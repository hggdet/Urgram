name: Build Urgram IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Generate Urgram codesigning data
        run: |
          python3 build-system/urgram/generate_codesigning.py \
            --out "$RUNNER_TEMP/urgram-codesigning"
          ls "$RUNNER_TEMP/urgram-codesigning/profiles"

      - name: Import SelfSigned certificate into keychain
        run: |
          python3 - <<'EOF'
          import os, re, sys
          sys.path.insert(0, "build-system/Make")
          from GenerateProfiles import setup_temp_keychain
          # Same password extraction as generate_codesigning.py (the template
          # SelfSigned p12 password lives in GenerateProfiles.py).
          src = open("build-system/Make/GenerateProfiles.py").read()
          pw = re.search(r"""p12_password\s*=\s*['"]([^'"]*)['"]""", src).group(1)
          p12 = os.path.join(os.environ["RUNNER_TEMP"], "urgram-codesigning", "certs", "SelfSigned.p12")
          kc = setup_temp_keychain(p12, pw)
          print("keychain ready:", kc)
          EOF
          security find-identity -v -p codesigning

      - name: Write build configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'EOF'
          import json, os
          cfg = {
              "bundle_id": "com.hggdet.urgram",
              "api_id": os.environ["TG_API_ID"],
              "api_hash": os.environ["TG_API_HASH"],
              "team_id": "BUMPZKB7FC",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "urgram",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False
          }
          path = os.path.join(os.environ["RUNNER_TEMP"], "configuration.json")
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
          print("configuration written (api_id len %d, api_hash len %d)" % (len(cfg["api_id"]), len(cfg["api_hash"])))
          EOF

      - name: Build IPA (release_arm64)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath="$RUNNER_TEMP/configuration.json" \
            --codesigningInformationPath="$RUNNER_TEMP/urgram-codesigning" \
            --buildNumber=${{ github.run_number }} \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/artifacts"
          ls -la "$GITHUB_WORKSPACE/artifacts"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Urgram-IPA
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release with IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="$(ls artifacts/*.ipa | head -1)"
          TAG="v0.1-build${{ github.run_number }}"
          gh release create "$TAG" "$IPA" \
            --title "Urgram $TAG" \
            --notes "Unsigned Urgram IPA (Telegram-iOS 13.2 base). Re-sign with your own certificate before installing."
